<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FS2 MMU Map</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#57606a;--gray-f:#eef0f2;--gray-s:#8c959f;--teal-f:#d3f2ee;--teal-s:#1a8a7d;--purple-f:#ebe3fb;--purple-s:#7a52c7;--line:#57606a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--gray-f:#21262d;--gray-s:#6e7681;--teal-f:#0f3a36;--teal-s:#3cc7b5;--purple-f:#2d2347;--purple-s:#a98bf0;--line:#9da7b3}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--gray-f:#21262d;--gray-s:#6e7681;--teal-f:#0f3a36;--teal-s:#3cc7b5;--purple-f:#2d2347;--purple-s:#a98bf0;--line:#9da7b3}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
main{max-width:720px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 12px;color:var(--muted)}
svg{display:block;width:100%;height:auto}
.th{fill:var(--fg);font-size:13px;font-weight:600}
.ts{fill:var(--muted);font-size:11px}
.c-gray rect,rect.c-gray{fill:var(--gray-f);stroke:var(--gray-s)}
.c-teal rect,rect.c-teal{fill:var(--teal-f);stroke:var(--teal-s)}
.c-purple rect,rect.c-purple{fill:var(--purple-f);stroke:var(--purple-s)}
rect.box{fill:none;stroke:var(--gray-s)}
.arr{stroke:var(--line);stroke-width:1.5;fill:none}
</style></head><body><main>
<h1>FS2 process MMU map</h1>
<p>The eight 8 KB slots of FS2's process on WildBits (wb/flightsim2 e2232b6be, 2026-10-23).</p>
<svg width="100%" viewBox="0 0 680 530" role="img"><title>FS2 process MMU map</title><desc>The eight 8 KB MMU slots of FS2's process, $0000 to $FFFF: FS data and fsw in slots 0 and 1, the 16 KB scenery window in slots 2 and 3, the panel block in slot 4, FS code in slots 5 to 7 with the fixed I/O page at the top, and the blocks swapped into slots 2 and 4 while they run.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="108" y="62" text-anchor="end" dominant-baseline="central">$0000</text>
<text class="ts" x="108" y="112" text-anchor="end" dominant-baseline="central">$2000</text>
<text class="ts" x="108" y="162" text-anchor="end" dominant-baseline="central">$4000</text>
<text class="ts" x="108" y="212" text-anchor="end" dominant-baseline="central">$6000</text>
<text class="ts" x="108" y="262" text-anchor="end" dominant-baseline="central">$8000</text>
<text class="ts" x="108" y="359" text-anchor="end" dominant-baseline="central">$A000</text>
<text class="ts" x="108" y="450" text-anchor="end" dominant-baseline="central">$FD00</text>
<g class="c-gray"><rect x="120" y="40" width="300" height="44" rx="4" stroke-width="0.5"/>
<text class="th" x="270" y="54" text-anchor="middle" dominant-baseline="central">0  FS data, fsw part 1</text>
<text class="ts" x="270" y="72" text-anchor="middle" dominant-baseline="central">FS variables to $1BFE, fsw $1C00</text></g>
<g class="c-gray"><rect x="120" y="90" width="300" height="44" rx="4" stroke-width="0.5"/>
<text class="th" x="270" y="104" text-anchor="middle" dominant-baseline="central">1  fsw work, part 2, stack</text>
<text class="ts" x="270" y="122" text-anchor="middle" dominant-baseline="central">PolyMem, RecBuf, code, $3F00 stack</text></g>
<g class="c-teal"><rect x="120" y="140" width="300" height="44" rx="4" stroke-width="0.5"/>
<text class="th" x="270" y="154" text-anchor="middle" dominant-baseline="central">2  Scenery window, first half</text>
<text class="ts" x="270" y="172" text-anchor="middle" dominant-baseline="central">FS's own F$Mem data block</text></g>
<g class="c-teal"><rect x="120" y="190" width="300" height="44" rx="4" stroke-width="0.5"/>
<text class="th" x="270" y="204" text-anchor="middle" dominant-baseline="central">3  Scenery window, second half</text>
<text class="ts" x="270" y="222" text-anchor="middle" dominant-baseline="central">WbAScrn's third block (new)</text></g>
<g class="c-gray"><rect x="120" y="240" width="300" height="44" rx="4" stroke-width="0.5"/>
<text class="th" x="270" y="254" text-anchor="middle" dominant-baseline="central">4  Panel block</text>
<text class="ts" x="270" y="272" text-anchor="middle" dominant-baseline="central">CoCo panel rows, plotter at $9D10</text></g>
<g class="c-gray"><rect x="120" y="290" width="300" height="138" rx="4" stroke-width="0.5"/>
<text class="th" x="270" y="350" text-anchor="middle" dominant-baseline="central">5-7  FS module code</text>
<text class="ts" x="270" y="368" text-anchor="middle" dominant-baseline="central">$A000-$FCF4, 23,797 bytes</text></g>
<g class="c-gray"><rect x="120" y="434" width="300" height="32" rx="4" stroke-width="0.5"/>
<text class="ts" x="270" y="450" text-anchor="middle" dominant-baseline="central">Fixed I/O $FD00-$FFFF (math, DMA, PP)</text></g>
<g class="c-purple"><rect x="460" y="140" width="180" height="44" rx="4" stroke-width="0.5"/>
<text class="th" x="550" y="154" text-anchor="middle" dominant-baseline="central">Overlays, clouds</text>
<text class="ts" x="550" y="172" text-anchor="middle" dominant-baseline="central">F2-F5 menus; K2 fscl</text></g>
<line x1="458" y1="162" x2="424" y2="162" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="460" y="190" width="180" height="44" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="550" y="204" text-anchor="middle" dominant-baseline="central">Was VICKY_BLK</text>
<text class="ts" x="550" y="222" text-anchor="middle" dominant-baseline="central">Now through SS.Gpu</text>
<g class="c-purple"><rect x="460" y="240" width="180" height="44" rx="4" stroke-width="0.5"/>
<text class="th" x="550" y="254" text-anchor="middle" dominant-baseline="central">fsx, fswc, fsp</text>
<text class="ts" x="550" y="272" text-anchor="middle" dominant-baseline="central">Each while it runs</text></g>
<line x1="458" y1="262" x2="424" y2="262" class="arr" marker-end="url(#arrow)"/>
<rect class="c-teal" x="120" y="488" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="142" y="495" dominant-baseline="central">Scenery window 16 KB</text>
<rect class="c-purple" x="300" y="488" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="322" y="495" dominant-baseline="central">Swapped in</text>
<rect class="c-gray" x="420" y="488" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="442" y="495" dominant-baseline="central">Fixed</text>
</svg>
</main></body></html>
